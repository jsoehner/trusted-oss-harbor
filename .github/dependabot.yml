version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  cooldown:
    default-days: 7
  commit-message:
    prefix: ci(deps)
  open-pull-requests-limit: 5
  assignees:
  - jsoehner

- package-ecosystem: pip
  directory: /gatekeeper
  schedule:
    interval: weekly
    day: monday
  cooldown:
    default-days: 7
  commit-message:
    prefix: chore(deps)
  open-pull-requests-limit: 10
  assignees:
  - jsoehner

- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
  cooldown:
    default-days: 7
  commit-message:
    prefix: chore(docker)
  open-pull-requests-limit: 5
  assignees:
  - jsoehner

- package-ecosystem: docker
  directory: /gatekeeper
  schedule:
    interval: weekly
    day: monday
  cooldown:
    default-days: 7
  commit-message:
    prefix: chore(docker)
  open-pull-requests-limit: 5
  assignees:
  - jsoehner
