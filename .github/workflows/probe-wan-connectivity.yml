name: Probe WAN Edge Connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Test Inbound Connectivity to pfSense & Trusted OSS
    runs-on: ubuntu-latest
    steps:
      - name: Display Runner Public IP
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "GitHub Runner Public IP: ${RUNNER_IP}"

      - name: Test DNS, mTLS Handshake & Rejection of Unauthenticated Requests
        env:
          TRUSTED_OSS_CACHE_URL: ${{ vars.TRUSTED_OSS_CACHE_URL || 'https://jsigroup.ddns.net' }}
          OSS_MTLS_CLIENT_CERT: ${{ secrets.OSS_MTLS_CLIENT_CERT }}
          OSS_MTLS_CLIENT_KEY: ${{ secrets.OSS_MTLS_CLIENT_KEY }}
        run: |
          CACHE_URL="${TRUSTED_OSS_CACHE_URL%/}"
          HOST="${CACHE_URL#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST%%/*}"
          HOST="${HOST%%:*}"

          echo "=== Target: ${CACHE_URL} (host: ${HOST}) ==="
          dig +short "${HOST}" || nslookup "${HOST}"

          echo -e "\n=== 1. Unauthenticated Request (Should Be Rejected by mTLS) ==="
          curl -v --connect-timeout 7 "${CACHE_URL}/healthz" 2>&1 || true

          if [[ -n "${OSS_MTLS_CLIENT_CERT}" && -n "${OSS_MTLS_CLIENT_KEY}" ]]; then
            mkdir -p ~/.oss-tls
            printf '%s\n' "${OSS_MTLS_CLIENT_CERT}" > ~/.oss-tls/client.crt
            printf '%s\n' "${OSS_MTLS_CLIENT_KEY}" > ~/.oss-tls/client.key
            chmod 0600 ~/.oss-tls/client.key

            echo -e "\n=== 2. Authenticated mTLS Request to /healthz (Should Return 200 OK) ==="
            curl -fsSLv --connect-timeout 10 \
              --cert ~/.oss-tls/client.crt \
              --key ~/.oss-tls/client.key \
              "${CACHE_URL}/healthz"
          else
            echo "[WARN] OSS_MTLS_CLIENT_CERT / OSS_MTLS_CLIENT_KEY not set; skipping mTLS test."
          fi
