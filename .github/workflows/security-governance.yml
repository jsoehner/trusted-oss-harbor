name: Security Governance & Automated Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

  sast-and-dependency-scan:
    name: SAST (Bandit + Semgrep) & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install security scanners
        run: python -m pip install --no-cache-dir bandit pip-audit semgrep

      - name: Run Bandit SAST (Medium+ severity)
        run: bandit -r gatekeeper/app scripts client-templates -ll

      - name: Run pip-audit on Gatekeeper dependencies
        run: pip-audit -r gatekeeper/requirements.txt

      - name: Run Semgrep SAST Analysis
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --error \
            --severity ERROR \
            --sarif --output semgrep-results.sarif \
            gatekeeper/app scripts client-templates

      - name: Upload Semgrep SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-sast
