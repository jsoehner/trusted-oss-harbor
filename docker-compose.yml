name: trusted-oss-harbor

services:
  clamav:
    image: clamav/clamav:1.4
    container_name: oss-clamav
    restart: unless-stopped
    volumes:
      - ${OSS_DATA_ROOT:-/home/jsoehner/trusted-oss-data}/scanners/clamav:/var/lib/clamav
      - ./config/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./config/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    expose:
      - "3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - oss-trust-net

  harbor-scanner-clamav:
    image: ghcr.io/antonagrarov/harbor-scanner-clamav:latest
    container_name: harbor-scanner-clamav
    restart: unless-stopped
    depends_on:
      - clamav
    environment:
      SCANNER_CLAMAV_HOST: clamav
      SCANNER_CLAMAV_PORT: "3310"
      SCANNER_API_SERVER_ADDR: ":8080"
    expose:
      - "8080"
    networks:
      - oss-trust-net

  oss-bus:
    image: valkey/valkey:8-alpine
    container_name: oss-bus
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - oss-trust-net

  oss-frontend:
    build:
      context: ./gatekeeper
      dockerfile: Dockerfile
    container_name: oss-frontend
    restart: unless-stopped
    depends_on:
      oss-bus:
        condition: service_healthy
    environment:
      GATEKEEPER_ROLE: frontend
      BUS_URL: redis://oss-bus:6379/0
      OSS_DATA_ROOT: /data/trusted-oss
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CVSS_FAIL_THRESHOLD: ${CVSS_FAIL_THRESHOLD:-7.0}
      AUTO_PROMOTE_CLEAN_ARTIFACTS: ${AUTO_PROMOTE_CLEAN_ARTIFACTS:-true}
      UPSTREAM_MAVEN_URL: ${UPSTREAM_MAVEN_URL:-https://repo.maven.apache.org/maven2}
      UPSTREAM_PYPI_SIMPLE_URL: ${UPSTREAM_PYPI_SIMPLE_URL:-https://pypi.org/simple}
      GNUPGHOME: /data/trusted-oss/keys/gnupg
      COSIGN_PRIVATE_KEY_PATH: /data/trusted-oss/keys/cosign/cosign.key
      COSIGN_PUBLIC_KEY_PATH: /data/trusted-oss/keys/cosign/cosign.pub
      COSIGN_PASSWORD: ${COSIGN_PASSWORD:-}
      GATEKEEPER_ADMIN_TOKEN: ${GATEKEEPER_ADMIN_TOKEN:?GATEKEEPER_ADMIN_TOKEN must be set}
    volumes:
      - ${OSS_DATA_ROOT:-/home/jsoehner/trusted-oss-data}:/data/trusted-oss
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      oss-trust-net:
        aliases:
          - oss-gatekeeper

  oss-engine:
    build:
      context: ./gatekeeper
      dockerfile: Dockerfile
    container_name: oss-engine
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      oss-bus:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      GATEKEEPER_ROLE: engine
      BUS_URL: redis://oss-bus:6379/0
      ENGINE_MAX_CONCURRENCY: ${ENGINE_MAX_CONCURRENCY:-2}
      CVE_RESCAN_INTERVAL_SECONDS: ${CVE_RESCAN_INTERVAL_SECONDS:-3600}
      OSS_DATA_ROOT: /data/trusted-oss
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CVSS_FAIL_THRESHOLD: ${CVSS_FAIL_THRESHOLD:-7.0}
      AUTO_PROMOTE_CLEAN_ARTIFACTS: ${AUTO_PROMOTE_CLEAN_ARTIFACTS:-true}
      UPSTREAM_MAVEN_URL: ${UPSTREAM_MAVEN_URL:-https://repo.maven.apache.org/maven2}
      UPSTREAM_PYPI_SIMPLE_URL: ${UPSTREAM_PYPI_SIMPLE_URL:-https://pypi.org/simple}
      GNUPGHOME: /data/trusted-oss/keys/gnupg
      COSIGN_PRIVATE_KEY_PATH: /data/trusted-oss/keys/cosign/cosign.key
      COSIGN_PUBLIC_KEY_PATH: /data/trusted-oss/keys/cosign/cosign.pub
      COSIGN_PASSWORD: ${COSIGN_PASSWORD:-}
      GATEKEEPER_ADMIN_TOKEN: ${GATEKEEPER_ADMIN_TOKEN:?GATEKEEPER_ADMIN_TOKEN must be set}
    volumes:
      - ${OSS_DATA_ROOT:-/home/jsoehner/trusted-oss-data}:/data/trusted-oss
    networks:
      - oss-trust-net

  oss-gateway:
    image: nginx:1.27-alpine
    container_name: oss-gateway
    restart: unless-stopped
    depends_on:
      - oss-frontend
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./config/nginx/oss-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ${OSS_DATA_ROOT:-/home/jsoehner/trusted-oss-data}/packages/trusted-maven:/var/www/trusted-maven:ro
      - ${OSS_DATA_ROOT:-/home/jsoehner/trusted-oss-data}/packages/trusted-pypi:/var/www/trusted-pypi:ro
      - ${OSS_DATA_ROOT:-/home/jsoehner/trusted-oss-data}/keys/public:/var/www/keys:ro
    networks:
      - oss-trust-net

networks:
  oss-trust-net:
    name: oss-trust-net
    driver: bridge
