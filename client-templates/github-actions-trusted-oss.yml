# ==============================================================================
# GitHub Actions Snippet: Opt-In Trusted OSS Cache (mTLS) or Public Default
# ==============================================================================
# Default behavior: if vars.TRUSTED_OSS_CACHE_URL (and vars.HARBOR_DOMAIN) are
# unset/empty, this step is a no-op and the build uses public upstream repos.
# When vars.TRUSTED_OSS_CACHE_URL is set (e.g. https://oss.yourdomain.com),
# mTLS credentials are loaded and Maven/pip/uv are routed to the trusted cache.
# ==============================================================================
steps:
  - name: Configure Trusted OSS Cache (mTLS) if TRUSTED_OSS_CACHE_URL is set
    env:
      TRUSTED_OSS_CACHE_URL: ${{ vars.TRUSTED_OSS_CACHE_URL }}
      TRUSTED_OSS_MODE: ${{ vars.TRUSTED_OSS_MODE || 'virtual' }}
      HARBOR_DOMAIN: ${{ vars.HARBOR_DOMAIN }}
      OSS_MTLS_CLIENT_CERT: ${{ secrets.OSS_MTLS_CLIENT_CERT }}
      OSS_MTLS_CLIENT_KEY: ${{ secrets.OSS_MTLS_CLIENT_KEY }}
    run: |
      CACHE_URL="${TRUSTED_OSS_CACHE_URL}"
      if [[ -z "$CACHE_URL" && -n "$HARBOR_DOMAIN" ]]; then
        CACHE_URL="https://${HARBOR_DOMAIN}"
      fi
      CACHE_URL="${CACHE_URL%/}"

      if [[ -z "$CACHE_URL" ]]; then
        echo "[INFO] TRUSTED_OSS_CACHE_URL is not set; using public upstream OSS repositories (default)."
        exit 0
      fi

      echo "[INFO] Configuring mTLS connection to Trusted OSS Cache: ${CACHE_URL} (mode=${TRUSTED_OSS_MODE})"
      mkdir -p ~/.m2 ~/.oss-tls
      printf '%s\n' "$OSS_MTLS_CLIENT_CERT" > ~/.oss-tls/client.crt
      printf '%s\n' "$OSS_MTLS_CLIENT_KEY" > ~/.oss-tls/client.key
      chmod 0600 ~/.oss-tls/client.key

      # 1. Fetch GPG public key using mTLS client credentials
      curl -fsSL --cert ~/.oss-tls/client.crt --key ~/.oss-tls/client.key \
        "${CACHE_URL}/keys/trusted-oss-pubkey.asc" -o ~/.oss-tls/trusted-oss-pubkey.asc
      gpg --batch --import ~/.oss-tls/trusted-oss-pubkey.asc

      # 2. Convert PEM to PKCS#12 Keystore for Maven / Java Native mTLS
      openssl pkcs12 -export \
        -in ~/.oss-tls/client.crt \
        -inkey ~/.oss-tls/client.key \
        -out ~/.oss-tls/client.p12 \
        -passout pass:changeit

      # 3. Export Maven & Python (pip/uv) environment variables
      echo "MAVEN_OPTS=-Djavax.net.ssl.keyStore=$HOME/.oss-tls/client.p12 -Djavax.net.ssl.keyStoreType=PKCS12 -Djavax.net.ssl.keyStorePassword=changeit" >> "$GITHUB_ENV"
      echo "PIP_INDEX_URL=${CACHE_URL}/pypi/${TRUSTED_OSS_MODE}/simple" >> "$GITHUB_ENV"
      echo "UV_INDEX_URL=${CACHE_URL}/pypi/${TRUSTED_OSS_MODE}/simple" >> "$GITHUB_ENV"

      # 4. Generate Maven Settings pointing to Trusted OSS Cache
      sed -e "s|https://\${HARBOR_DOMAIN}/maven/trusted|${CACHE_URL}/maven/${TRUSTED_OSS_MODE}|g" \
          -e "s|\${TRUSTED_OSS_CACHE_URL}|${CACHE_URL}|g" \
          -e "s|\${TRUSTED_OSS_MODE}|${TRUSTED_OSS_MODE}|g" \
          client-templates/maven-settings.xml > ~/.m2/settings.xml
