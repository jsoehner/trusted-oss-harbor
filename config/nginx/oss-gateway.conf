# Unified Trusted OSS Gateway (Routes OCI /v2/ to Harbor and /maven/, /pypi/ to oss-gatekeeper)
limit_req_zone $binary_remote_addr zone=gatekeeper_admin:10m rate=10r/s;

upstream gatekeeper_backend {
    server oss-frontend:8000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 512M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 30s;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Healthcheck endpoint
    location = /healthz {
        proxy_pass http://gatekeeper_backend/healthz;
        proxy_set_header Host $host;
    }

    # Public Signing Keys (GPG & Cosign public keys for client verification)
    location /keys/ {
        proxy_pass http://gatekeeper_backend/keys/;
        proxy_set_header Host $host;
    }

    # Provenance Audit Log
    location /audit/ {
        proxy_pass http://gatekeeper_backend/audit/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Trusted & Virtual Maven2 Repositories (Dynamic Quarantine -> ClamAV -> CVE Gate -> GPG Sign)
    location /maven/trusted/ {
        proxy_pass http://gatekeeper_backend/maven/trusted/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /maven/virtual/ {
        proxy_pass http://gatekeeper_backend/maven/virtual/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Trusted & Virtual PyPI Simple Repositories (PEP 503)
    location /pypi/trusted/ {
        proxy_pass http://gatekeeper_backend/pypi/trusted/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pypi/virtual/ {
        proxy_pass http://gatekeeper_backend/pypi/virtual/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Harbor OCI v2 Proxy Cache for Chainguard (cgr.dev/chainguard/jre & python)
    location /v2/ {
        proxy_pass http://gatekeeper_backend/v2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring Boot & Chainguard Seed Catalog Warming / Status
    location /catalog/ {
        limit_req zone=gatekeeper_admin burst=10 nodelay;
        proxy_pass http://gatekeeper_backend/catalog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Artifact Ingest API
    location /ingest/ {
        limit_req zone=gatekeeper_admin burst=5 nodelay;
        proxy_pass http://gatekeeper_backend/ingest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OCI Promotion Webhook / Gatekeeper API
    location /oci/ {
        proxy_pass http://gatekeeper_backend/oci/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Background Engine Job Status API
    location /jobs {
        proxy_pass http://gatekeeper_backend/jobs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
