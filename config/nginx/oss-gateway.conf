# Unified Trusted OSS Gateway (Routes OCI /v2/ to Harbor and /maven/, /pypi/ to oss-gatekeeper)
upstream gatekeeper_backend {
    server oss-gatekeeper:8000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 512M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 30s;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Healthcheck endpoint
    location = /healthz {
        proxy_pass http://gatekeeper_backend/healthz;
        proxy_set_header Host $host;
    }

    # Public Signing Keys (GPG & Cosign public keys for client verification)
    location /keys/ {
        proxy_pass http://gatekeeper_backend/keys/;
        proxy_set_header Host $host;
    }

    # Provenance Audit Log
    location /audit/ {
        proxy_pass http://gatekeeper_backend/audit/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Trusted & Signed Maven2 Repository (Dynamic Quarantine -> ClamAV -> Trivy -> GPG Sign)
    location /maven/trusted/ {
        proxy_pass http://gatekeeper_backend/maven/trusted/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Trusted & Signed PyPI Simple Repository (PEP 503)
    location /pypi/trusted/ {
        proxy_pass http://gatekeeper_backend/pypi/trusted/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Harbor OCI v2 Proxy Cache for Chainguard (cgr.dev/chainguard/jre & python)
    location /v2/ {
        proxy_pass http://gatekeeper_backend/v2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring Boot & Chainguard Seed Catalog Warming / Status
    location /catalog/ {
        proxy_pass http://gatekeeper_backend/catalog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OCI Promotion Webhook / Gatekeeper API
    location /oci/ {
        proxy_pass http://gatekeeper_backend/oci/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
