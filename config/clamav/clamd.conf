# Hardened ClamAV Daemon Configuration for OSS Supply Chain Scanning
LogTime yes
LogClean no
LogVerbose no
ExtendedDetectionInfo yes

LocalSocket /tmp/clamd.sock
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0

MaxConnectionQueueLength 200
StreamMaxLength 500M
MaxThreads 12
ReadTimeout 300
CommandReadTimeout 30
SendBufTimeout 200

# Deep Archive & Bytecode Inspection (JAR, WAR, Wheel, Tarball, ZIP, ELF, PE)
ScanPE yes
ScanELF yes
DetectBrokenExecutables yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanMail no
ScanHTML yes
ScanArchive yes
AlertEncrypted yes

MaxScanTime 120000
MaxScanSize 500M
MaxFileSize 250M
MaxRecursion 20
MaxFiles 25000
