services:
  trusted-oss-gatekeeper:
    image: ghcr.io/jsoehner/trusted-oss-gatekeeper:latest
    container_name: trusted-oss-gatekeeper
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /mnt/Pool1/trusted-oss-data:/data
    environment:
      - CVSS_FAIL_THRESHOLD=7.0
      - AUTO_PROMOTE_CLEAN_ARTIFACTS=true
      - UPSTREAM_MAVEN_URL=https://maven-central.storage-download.googleapis.com/maven2,https://repo.maven.apache.org/maven2,https://repo.spring.io/milestone
      - UPSTREAM_PYPI_SIMPLE_URL=https://pypi.org/simple
